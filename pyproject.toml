[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signallock"
version = "0.1.0"
description = "OSINT-calibrated password risk assessment and context-aware enterprise authentication hardening."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "SignalLock Project" }
]
keywords = [
  "cybersecurity",
  "authentication",
  "osint",
  "password-security",
  "adaptive-authentication",
  "risk-scoring"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: Scientific/Engineering"
]

[project.urls]
Homepage = "https://github.com/sagarkishore-7/signallock"
Repository = "https://github.com/sagarkishore-7/signallock"
Issues = "https://github.com/sagarkishore-7/signallock/issues"

[project.scripts]
signallock = "signallock.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
