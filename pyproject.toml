[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon"
version = "0.2.0"
description = "Adversary-mirrored OSINT exposure and password-predictability assessment for authentication hardening."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Eidolon Project" }
]
keywords = [
  "cybersecurity",
  "authentication",
  "osint",
  "password-security",
  "adaptive-authentication",
  "risk-scoring"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering"
]

[project.urls]
Homepage = "https://github.com/sagarkishore-7/signallock"
Repository = "https://github.com/sagarkishore-7/signallock"
Issues = "https://github.com/sagarkishore-7/signallock/issues"

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]
osint = ["httpx>=0.27", "zxcvbn>=4.4", "beautifulsoup4>=4.12"]
viz = ["matplotlib>=3.7"]
demo = ["fastapi>=0.110", "uvicorn>=0.27", "bcrypt>=4.0"]

[project.scripts]
eidolon = "eidolon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
